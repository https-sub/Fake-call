<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Body Puppeteer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #000; margin: 0; overflow: hidden; }
        
        /* The Full Screen Photo */
        #puppetContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out; /* Smooth following */
        }

        #puppetImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* User Camera in Bottom Left */
        #userCamContainer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 130px;
            border-radius: 15px;
            border: 2px solid white;
            overflow: hidden;
            z-index: 100;
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div id="puppetContainer">
        <img id="puppetImg" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=800">
    </div>

    <div id="userCamContainer">
        <video id="inputVideo" playsinline></video>
    </div>

    <canvas id="outputCanvas" class="hidden"></canvas>

    <script>
        const videoElement = document.getElementById('inputVideo');
        const puppet = document.getElementById('puppetContainer');

        function onResults(results) {
            if (!results.poseLandmarks) return;

            // 1. Get the Center of your Body (Mid-Hip)
            const midHip = results.poseLandmarks[24]; // Right Hip
            
            // 2. Map your movement to the Photo
            // X: -50 to 50px movement | Y: -50 to 50px movement
            const moveX = (0.5 - midHip.x) * 200; 
            const moveY = (midHip.y - 0.5) * 200;
            const scale = 1 + (Math.abs(moveY) / 500); // Zooms slightly when moving

            // 3. Apply the movement to the Photo
            puppet.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;

            // 4. Special Action: JUMP detection
            if (midHip.y < 0.4) { // You jumped high
                puppet.style.filter = "brightness(1.5)";
            } else {
                puppet.style.filter = "brightness(1)";
            }
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
