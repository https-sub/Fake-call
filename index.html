<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Immersive Call</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000; margin: 0; overflow: hidden; height: 100vh; }
        
        /* FULL SCREEN CHARACTER CONTAINER */
        #puppetContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transition: transform 0.1s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #puppetImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* USER CAM BOTTOM LEFT */
        #userCamContainer {
            position: fixed;
            bottom: 120px;
            left: 20px;
            width: 100px;
            height: 140px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
            z-index: 100;
            background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* UI CONTROLS */
        .control-panel {
            position: fixed;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 200;
        }
        .btn-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 12px 35px;
            display: flex;
            gap: 35px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div id="puppetContainer">
        <img id="puppetImg" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=800">
    </div>

    <div id="userCamContainer">
        <video id="inputVideo" playsinline></video>
    </div>

    <div class="absolute top-10 w-full text-center z-50 pointer-events-none">
        <h1 class="text-xl font-bold tracking-widest text-white drop-shadow-lg">LIVE AI PUPPET</h1>
        <p id="timer" class="text-zinc-400 font-mono text-sm">00:00</p>
    </div>

    <div class="control-panel">
        <div class="btn-box">
            <label class="cursor-pointer text-white hover:text-amber-500">
                <input type="file" accept="image/*" class="hidden" onchange="loadPhoto(event)">
                <i class="fas fa-image text-2xl"></i>
            </label>

            <button onclick="window.location.reload()" class="bg-red-500 w-14 h-14 rounded-full flex items-center justify-center text-white">
                <i class="fas fa-phone-slash text-xl rotate-[135deg]"></i>
            </button>

            <button onclick="alert('Stand back so the AI can see your body to move the puppet!')" class="text-white hover:text-blue-400">
                <i class="fas fa-info-circle text-2xl"></i>
            </button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('inputVideo');
        const puppet = document.getElementById('puppetContainer');
        let timer = 0;

        // Timer Function
        setInterval(() => {
            timer++;
            const m = String(Math.floor(timer/60)).padStart(2,'0');
            const s = String(timer%60).padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);

        // Photo Upload Function
        function loadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('puppetImg').src = URL.createObjectURL(file);
            }
        }

        // Body Tracking Logic
        function onResults(results) {
            if (!results.poseLandmarks) return;
            const midHip = results.poseLandmarks[24]; 
            
            // Movement sensitivity
            const moveX = (0.5 - midHip.x) * 150; 
            const moveY = (midHip.y - 0.5) * 150;
            const scale = 1 + (Math.abs(moveY) / 400);

            puppet.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
            
            // JUMP effect
            if (midHip.y < 0.45) {
                puppet.style.filter = "brightness(1.4) contrast(1.1)";
            } else {
                puppet.style.filter = "brightness(1) contrast(1)";
            }
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
