<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Body Puppeteer Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000; margin: 0; overflow: hidden; height: 100vh; }
        #puppetContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; transition: transform 0.1s ease-out; display: flex; justify-content: center; align-items: center; }
        #puppetImg { width: 100%; height: 100%; object-fit: cover; }
        #userCamContainer { position: fixed; bottom: 120px; left: 20px; width: 100px; height: 140px; border-radius: 15px; border: 2px solid white; overflow: hidden; z-index: 100; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        /* Style to handle mirroring correctly */
        .mirror { transform: scaleX(-1); }
        .control-panel { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; z-index: 200; }
        .btn-box { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border-radius: 50px; padding: 12px 30px; display: flex; gap: 25px; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="puppetContainer">
        <img id="puppetImg" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=800">
    </div>

    <div id="userCamContainer">
        <video id="inputVideo" class="mirror" playsinline></video>
    </div>

    <div class="control-panel">
        <div class="btn-box">
            <label class="cursor-pointer text-white hover:text-amber-500">
                <input type="file" accept="image/*" class="hidden" onchange="loadPhoto(event)">
                <i class="fas fa-image text-xl"></i>
            </label>

            <button onclick="switchCamera()" class="text-white hover:text-blue-400">
                <i class="fas fa-sync-alt text-xl"></i>
            </button>

            <button onclick="window.location.reload()" class="bg-red-500 w-12 h-12 rounded-full flex items-center justify-center text-white">
                <i class="fas fa-phone-slash text-lg rotate-[135deg]"></i>
            </button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('inputVideo');
        const puppet = document.getElementById('puppetContainer');
        let currentFacingMode = 'user'; // Start with front camera
        let camera = null;

        function onResults(results) {
            if (!results.poseLandmarks) return;
            const midHip = results.poseLandmarks[24]; 
            const moveX = (0.5 - midHip.x) * 150; 
            const moveY = (midHip.y - 0.5) * 150;
            const scale = 1 + (Math.abs(moveY) / 400);
            puppet.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true });
        pose.onResults(onResults);

        // Function to start camera with specific mode
        async function startCamera(mode) {
            if (camera) { await camera.stop(); }
            
            // Toggle mirroring: mirror front cam, don't mirror back cam
            if (mode === 'user') {
                videoElement.classList.add('mirror');
            } else {
                videoElement.classList.remove('mirror');
            }

            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({image: videoElement}); },
                facingMode: mode,
                width: 640,
                height: 480
            });
            camera.start();
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        }

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (file) { document.getElementById('puppetImg').src = URL.createObjectURL(file); }
        }

        // Initialize with front camera
        startCamera('user');
    </script>
</body>
</html>
