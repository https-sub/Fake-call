<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Avatar Puppeteer | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; font-family: sans-serif; overflow: hidden; }
        
        /* The character container */
        .avatar-box {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.2));
        }

        /* The 'Speaking' animation trigger */
        .speaking {
            transform: scale(1.08) translateY(-10px);
            filter: drop-shadow(0 0 50px rgba(245, 158, 11, 0.5)) brightness(1.2);
        }

        /* Your Camera in Bottom Left */
        #localVideoContainer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 160px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            background: #000;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror view */
        }

        .control-panel {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 15px 30px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white">

    <div class="relative w-full h-screen flex flex-col items-center justify-center">
        
        <div class="absolute top-16 text-center">
            <p class="text-amber-500 font-bold tracking-[0.3em] text-xs mb-2">INCOMING ENCRYPTED CALL</p>
            <h1 id="displayName" class="text-3xl font-black italic">AI CHARACTER</h1>
            <p id="timer" class="text-zinc-500 font-mono mt-1">00:00</p>
        </div>

        <div id="avatarTarget" class="avatar-box w-64 h-64 md:w-96 md:h-96 rounded-full border-4 border-zinc-800 overflow-hidden">
            <img id="characterImg" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000" class="w-full h-full object-cover">
        </div>

        <div id="localVideoContainer">
            <video id="userCam" autoplay muted playsinline></video>
        </div>

        <div class="fixed bottom-10 flex flex-col items-center gap-6">
            <div class="control-panel flex items-center gap-8 shadow-2xl border border-white/5">
                <label class="cursor-pointer hover:text-amber-500 transition">
                    <input type="file" accept="image/*" class="hidden" onchange="updateAvatar(event)">
                    <i class="fas fa-user-edit text-2xl"></i>
                </label>

                <button onclick="window.location.reload()" class="bg-red-500 w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 active:scale-90 transition">
                    <i class="fas fa-phone-slash text-xl rotate-[135deg]"></i>
                </button>

                <button id="micBtn" onclick="toggleMic()" class="text-white hover:text-amber-500 transition">
                    <i class="fas fa-microphone text-2xl"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <script>
        let timerSeconds = 0;
        let isMuted = false;

        // 1. Setup Timer
        setInterval(() => {
            timerSeconds++;
            const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }, 1000);

        // 2. Setup Camera and Voice Tracking
        async function initCall() {
            const video = document.getElementById('userCam');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            video.srcObject = stream;

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function animateAvatar() {
                analyser.getByteFrequencyData(dataArray);
                let volume = 0;
                for (let i = 0; i < bufferLength; i++) {
                    volume += dataArray[i];
                }
                let average = volume / bufferLength;

                const avatar = document.getElementById('avatarTarget');
                
                // If you speak, move the puppet
                if (average > 35 && !isMuted) {
                    avatar.classList.add('speaking');
                } else {
                    avatar.classList.remove('speaking');
                }
                
                requestAnimationFrame(animateAvatar);
            }
            animateAvatar();
        }

        // 3. Functions
        function updateAvatar(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById('characterImg');
                img.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
            document.getElementById('displayName').innerText = "CUSTOM CHARACTER";
        }

        function toggleMic() {
            isMuted = !isMuted;
            document.getElementById('micBtn').innerHTML = isMuted ? 
                '<i class="fas fa-microphone-slash text-red-500 text-2xl"></i>' : 
                '<i class="fas fa-microphone text-2xl"></i>';
        }

        // Start everything
        initCall().catch(err => console.log("Camera access denied or unavailable."));
    </script>
</body>
  </html>
