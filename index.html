<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Puppeteer Call</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #050505; font-family: sans-serif; overflow: hidden; margin: 0; }
        .avatar-box { transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .speaking { transform: scale(1.1) translateY(-10px); filter: brightness(1.2) drop-shadow(0 0 30px #fbbf24); }
        
        #localVideoContainer {
            position: fixed;
            bottom: 30px;
            left: 20px;
            width: 110px;
            height: 150px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            z-index: 100;
            background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .ui-panel { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); border-radius: 50px; padding: 15px 35px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-white min-h-screen">

    <div class="absolute top-16 text-center z-10">
        <p class="text-amber-500 font-bold tracking-[0.4em] text-[10px] mb-2 uppercase">Secure AI Channel</p>
        <h1 id="displayName" class="text-3xl font-black tracking-tighter">AI AVATAR</h1>
        <p id="timer" class="font-mono opacity-50 mt-1">00:00</p>
    </div>

    <div id="avatarTarget" class="avatar-box w-72 h-72 md:w-96 md:h-96 rounded-full border-4 border-zinc-900 overflow-hidden shadow-2xl">
        <img id="characterImg" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=800" class="w-full h-full object-cover">
    </div>

    <div id="localVideoContainer">
        <video id="userCam" autoplay muted playsinline></video>
    </div>

    <div class="fixed bottom-10 flex flex-col items-center z-50">
        <div class="ui-panel flex items-center gap-10">
            <label class="cursor-pointer hover:text-amber-500">
                <input type="file" accept="image/*" class="hidden" onchange="updateAvatar(event)">
                <i class="fas fa-image text-2xl"></i>
            </label>

            <button onclick="window.location.reload()" class="bg-red-500 w-14 h-14 rounded-full flex items-center justify-center shadow-xl active:scale-90 transition">
                <i class="fas fa-phone-slash text-xl rotate-[135deg]"></i>
            </button>

            <button id="micBtn" onclick="toggleMic()" class="hover:text-amber-500">
                <i class="fas fa-microphone text-2xl"></i>
            </button>
        </div>
    </div>

    <script>
        let isMuted = false;
        let timer = 0;

        // Timer Logic
        setInterval(() => {
            timer++;
            const m = String(Math.floor(timer/60)).padStart(2,'0');
            const s = String(timer%60).padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);

        // Camera & Puppeteering Logic
        async function startApp() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('userCam').srcObject = stream;

            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaStreamSource(stream);
            const ana = ctx.createAnalyser();
            ana.fftSize = 256;
            src.connect(ana);

            const data = new Uint8Array(ana.frequencyBinCount);
            const avatar = document.getElementById('avatarTarget');

            function loop() {
                ana.getByteFrequencyData(data);
                let volume = data.reduce((a, b) => a + b) / data.length;
                
                if (volume > 35 && !isMuted) {
                    avatar.classList.add('speaking');
                } else {
                    avatar.classList.remove('speaking');
                }
                requestAnimationFrame(loop);
            }
            loop();
        }

        function updateAvatar(e) {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('characterImg').src = URL.createObjectURL(file);
                document.getElementById('displayName').innerText = "LIVE AVATAR";
            }
        }

        function toggleMic() {
            isMuted = !isMuted;
            document.getElementById('micBtn').innerHTML = isMuted ? 
                '<i class="fas fa-microphone-slash text-red-500 text-2xl"></i>' : 
                '<i class="fas fa-microphone text-2xl"></i>';
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        startApp().catch(() => alert("Please allow Camera & Mic access."));
    </script>
</body>
</html>
